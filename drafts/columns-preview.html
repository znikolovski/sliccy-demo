              "@dropins/storefront-auth/": "/scripts/__dropins__/storefront-auth/",

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap">
  <link rel="stylesheet" href="/styles/styles.css"/>
  <script nonce="aem" type="module">
      if (!(HTMLScriptElement.supports?.('importmap'))) {
          import('/scripts/__dropins__/tools/shims/importmap.js');
      }
  </script>
  <script nonce="aem" src="/scripts/aem.js" type="module"></script>
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" src="/scripts/commerce.js" type="module"></script>
  <link rel="modulepreload" href="/scripts/__dropins__/tools/lib/aem/configs.js" />
  <link rel="modulepreload" href="/scripts/initializers/index.js" />
  <link rel="modulepreload" href="/scripts/initializers/auth.js" />
  <link rel="modulepreload" href="/scripts/initializers/personalization.js" />
  <link rel="modulepreload" href="/scripts/__dropins__/storefront-auth/api.js" />
  <link rel="modulepreload" href="/scripts/__dropins__/tools/event-bus.js" />

  <link rel="modulepreload" href="/scripts/__dropins__/tools/initializer.js" />
  <link rel="modulepreload" href="/scripts/__dropins__/tools/preact.js" />
  <link rel="modulepreload" href="/scripts/__dropins__/tools/preact-compat.js" />
  <link rel="modulepreload" href="/scripts/__dropins__/tools/preact-hooks.js" />
  <link rel="modulepreload" href="/scripts/__dropins__/tools/components.js" />
  <style>html, body { overflow: auto !important; }</style>
  <script nonce="aem" type="module">
    /* Preview shim: force EDS decoration if commerce init hangs (no backend in preview) */
    setTimeout(async () => {
      if (!document.body.classList.contains('appear')) {
        document.body.classList.add('appear');
      }
      if (!document.querySelector('.section')) {
        const m = await import('/scripts/aem.js');
        const main = document.querySelector('main');
        if (main) {
          m.decorateSections(main);
          m.decorateBlocks(main);
          m.decorateButtons(main);
          const blocks = Array.from(main.querySelectorAll('[data-block-name]'));
          for (const block of blocks) { await m.loadBlock(block); }
        }
      }
      /* EDS sets section display:none until loadSection resolves — show them in preview */
      document.querySelectorAll('.section[style*="display: none"]').forEach((s) => {
        s.style.removeProperty('display');
      });
    }, 3000);
  </script>
</head>
<body>
  <header></header>
  <main>
    <div>

        <div>
          <div>

            <p>The challenges of data center construction in 2022 can be met through a standardized data center approach.</p>
            <p><a href="/products.html">Shop Hardware</a></p>
          </div>
          <div>
            <picture>
              <img src="/drafts/images/home-energy-tactics.jpg" alt="Person at computer workstation in telecom network environment">
            </picture>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>
</html>
